<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171613" media="(prefers-color-scheme: dark)" />

    <!--
      Resolve the palette BEFORE the first paint.

      This cannot import `src/lib/theme/theme.ts` — it runs ahead of any bundle
      — so the storage key and the attribute are repeated here by hand, and
      `theme.test.ts` pins both strings so the duplication cannot drift. Without
      this script the first frame is light and the app then repaints dark, which
      is the flash every dark mode gets judged by.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('campus.theme')
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var theme =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference
          document.documentElement.setAttribute('data-theme', theme)
        } catch (_) {
          // No storage, no matchMedia, a locked-down browser. Light is the
          // documented default and the stylesheet already renders it.
        }
      })()
    </script>
    <meta
      name="description"
      content="Campus — tu cursada, ordenada. Plan de estudios, materias, entregas y correlativas en un solo lugar."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap"
      rel="stylesheet"
    />
    <title>Campus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
