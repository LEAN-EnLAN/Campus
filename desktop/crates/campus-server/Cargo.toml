[package]
name = "campus-server"
description = "The Campus vault transport: the /__campus/vault API, catalog and static assets (port of src/server). Mounted by the Tauri shell and by the loopback `campus-serve` binary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
http = ["dep:tiny_http"]

[dependencies]
campus-core.workspace = true
serde_json.workspace = true
tiny_http = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
junction.workspace = true

[[bin]]
name = "campus-serve"
required-features = ["http"]

[lints]
workspace = true
