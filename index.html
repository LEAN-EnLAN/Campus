<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content`: on Android the virtual keyboard shrinks
      the layout viewport (and `dvh`) instead of sliding over it, so the capture
      sheet sits above the keyboard and its "Guardar" stays reachable by scrolling
      inside the dialog. Browsers that do not know the key ignore it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#10224a" />

    <!--
      Resolve the palette BEFORE the first paint.

      This cannot import `src/lib/theme/theme.ts` — it runs ahead of any bundle
      — so the storage key and the attribute are repeated here by hand, and
      `theme.test.ts` pins both strings so the duplication cannot drift. Without
      this script the first frame is light and the app then repaints dark, which
      is the flash every dark mode gets judged by.
    -->
    <script>
      ;(function () {
        try {
          document.documentElement.setAttribute('data-theme', 'light')
        } catch (_) {
          // No storage, no matchMedia, a locked-down browser. Light is the
          // documented default and the stylesheet already renders it.
        }
      })()
    </script>
    <meta
      name="description"
      content="Campus — tu cursada, ordenada. Plan de estudios, materias, entregas y correlativas en un solo lugar."
    />
    <!-- Brand icons: built from public/brand/*.svg by scripts/build-brand.mjs. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Campus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
