<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content`: on Android the virtual keyboard shrinks
      the layout viewport (and `dvh`) instead of sliding over it, so the capture
      sheet sits above the keyboard and its "Guardar" stays reachable by scrolling
      inside the dialog. Browsers that do not know the key ignore it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#10224a" />

    <!--
      Resolve the palette BEFORE the first paint.

      This cannot import `src/lib/theme/theme.ts` — it runs ahead of any bundle
      — so the storage key and the attribute are repeated here by hand, and
      `theme.test.ts` pins both strings so the duplication cannot drift. Without
      this script the first frame is light and the app then repaints dark, which
      is the flash every dark mode gets judged by.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        // Hue -> accent id. Repeats ACCENTS in theme.ts (pinned by theme.test.ts).
        var accents = { 225: 'azul', 250: 'indigo', 150: 'verde', 30: 'coral', 290: 'violeta' }
        var theme = 'light'
        var accent = 'azul'
        try {
          var stored = localStorage.getItem('campus.theme')
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          theme =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference
          accent = accents[localStorage.getItem('campus.accent-hue')] || 'azul'
        } catch (_) {
          // No storage, no matchMedia, a locked-down browser: light + Azul Campus,
          // the documented defaults the stylesheet already renders.
        }
        root.setAttribute('data-theme', theme)
        root.setAttribute('data-accent', accent)
      })()
    </script>
    <meta
      name="description"
      content="Campus — tu cursada, ordenada. Plan de estudios, materias, entregas y correlativas en un solo lugar."
    />
    <!-- Brand icons: built from public/brand/*.svg by scripts/build-brand.mjs. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Open Graph: how a shared link to Campus looks in WhatsApp and friends. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Campus" />
    <meta property="og:locale" content="es_AR" />
    <meta
      property="og:title"
      content="Campus — tu plan de estudios, convertido en qué hacer hoy"
    />
    <meta
      property="og:description"
      content="Gratis para estudiantes. Plan, correlativas, finales y fechas en un solo lugar, en la web, el celu y Windows."
    />
    <meta property="og:image" content="/landing/hero.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Campus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
